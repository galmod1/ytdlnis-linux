app-id: org.galmod.ytdlnis.linux
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: ytdlnis-linux

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=~/.mozilla/firefox:ro
  - --filesystem=~/.librewolf:ro

modules:
  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - install -Dm755 yt-dlp_linux /app/bin/yt-dlp
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
        sha256: 767ba9dce7052aa196f8b12652f433d76de128ba168966fa84b6394d5e6c6795
        x-checker-data:
          type: json
          url: https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name == "yt-dlp_linux") | .browser_download_url

  - name: ytdlnis-linux
    buildsystem: simple
    build-commands:
      - install -d /app/share/ytdlnis-linux
      - cp -a main.py core ui assets /app/share/ytdlnis-linux/
      - install -d /app/bin
      - install -m755 flatpak/ytdlnis-linux.sh /app/bin/ytdlnis-linux
      - install -d /app/share/applications /app/share/metainfo
      - install -m644 flatpak/org.galmod.ytdlnis.linux.desktop /app/share/applications/
      - install -m644 flatpak/org.galmod.ytdlnis.linux.metainfo.xml /app/share/metainfo/
      - for s in 64 128 256 512; do install -Dm644 assets/icons/$s.png /app/share/icons/hicolor/${s}x${s}/apps/org.galmod.ytdlnis.linux.png; done
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - "**/__pycache__"
          - builddir
